collections:
  teaching: {"output":false,"permalink":"/:collection/:path/"}
  publications: {"output":true,"permalink":"/publications/:path/","sort_by":"order"}
  portfolio: {"output":false,"permalink":"/:collection/:path/"}
  talks: {"output":false,"permalink":"/:collection/:path/"}

defaults:
  - scope: {"path":"","type":"pages"}
    values: {"layout":"single","author_profile":true}
  - scope: {"path":"","type":"teaching"}
    values: {"layout":"single","author_profile":true,"share":true,"comments":true}
  - scope: {"path":"","type":"publications"}
    values: {"layout":"single","author_profile":true,"share":true,"comments":false}
  - scope: {"path":"","type":"portfolio"}
    values: {"layout":"single","author_profile":true,"share":true,"comment":true}
  - scope: {"path":"","type":"talks"}
    values: {"layout":"talk","author_profile":true,"share":true}

sass: {"sass_dir":"_sass","style":"compressed"}
permalink: "/:categories/:title/"
timezone: "Etc/UTC"

plugins: ["jekyll-feed", "jekyll-gist", "jekyll-paginate", "jekyll-sitemap", "jekyll-redirect-from", "jemoji"]
